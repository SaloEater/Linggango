
#UI Text Configuration
[ui]
	#Text displayed on the Undo button.
	undoButtonText = "Back"
	#Text displayed on the Confirm button.
	confirmButtonText = "Confirm"
	#Number of custom class slots (1-100). Restart required.
	#Range: 1 ~ 100
	customClassSlots = 7
	#Scale modifier for the Class Selection GUI (1.0 = Default size, 1.5 = 50% larger).
	guiScale = 1.0

#Built-In Class Settings.
[classes]

	[classes.warrior]
		#Display name shown in GUI.
		name = "Vanguard"
		#Lore text. Supports '&' color codes.
		description = "Trained in combat, you are just stronger than the average."
		#Cosmetic stat lines.
		stats = ["&a+30% Melee Damage", "&a+4 Armor", "&a+2 Armor Toughness", "&a+50% Knockback Resist", "&c-15% Speed", "&c-20% Attack Speed", "&c-50% Ranged Damage", "&c-100 Max Mana"]
		#Stat modifiers.
		attributes = ["puffish_attributes:melee_damage=0.30:multiply_base", "minecraft:generic.armor=4.0:addition", "minecraft:generic.armor_toughness=2.0:addition", "minecraft:generic.knockback_resistance=0.50:addition", "minecraft:generic.movement_speed=-0.15:multiply_base", "minecraft:generic.attack_speed=-0.20:multiply_base", "puffish_attributes:ranged_damage=-0.50:multiply_base", "irons_spellbooks:max_mana=-100.0:addition", "ars_nouveau:ars_nouveau.perk.max_mana=-100.0:addition"]
		#Items to place in Inventory. Format: modid:item{nbt}=count
		items = []
		#Item to equip in Main Hand. Format: modid:item{nbt}=count
		main_hand = "minecraft:stone_sword=1"
		#Item to equip in Off Hand. Format: modid:item{nbt}=count
		off_hand = "minecraft:shield=1"
		#Items to equip in Armor slots. Format: modid:item{nbt}=count
		armor = ["immersive_armors:wooden_helmet=1", "immersive_armors:wooden_chestplate=1", "immersive_armors:wooden_leggings=1", "immersive_armors:wooden_boots=1"]
		#Commands to execute when this class is selected. Use %player% for player name.
		commands = ["scale persist set true %player% %player%"]

	[classes.ranger]
		#Display name shown in GUI.
		name = "Pathfinder"
		#Lore text. Supports '&' color codes.
		description = "You are a master of ranged combat."
		#Cosmetic stat lines.
		stats = ["&6-10% Width", "&a+75% Projectile Dmg", "&a+100% Draw Speed", "&a+30% Arrow Velocity", "&a+15% Speed", "&c-60% Melee Damage", "&c-30% Melee Resistance", "&c-4 Max Health"]
		#Stat modifiers.
		attributes = ["puffish_attributes:ranged_damage=0.75:multiply_base", "attributeslib:draw_speed=1.0:multiply_base", "attributeslib:arrow_velocity=0.30:multiply_base", "minecraft:generic.movement_speed=0.15:multiply_base", "puffish_attributes:melee_damage=-0.60:multiply_base", "puffish_attributes:melee_resistance=-0.30:multiply_base", "minecraft:generic.max_health=-4.0:addition"]
		#Items to place in Inventory. Format: modid:item{nbt}=count
		items = ["minecraft:arrow=64"]
		#Item to equip in Main Hand. Format: modid:item{nbt}=count
		main_hand = "minecraft:bow=1"
		#Item to equip in Off Hand. Format: modid:item{nbt}=count
		off_hand = ""
		#Items to equip in Armor slots. Format: modid:item{nbt}=count
