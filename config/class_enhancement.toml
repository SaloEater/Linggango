		#Commands to execute when this class is selected. Use %player% for player name.
		commands = ["scale set pehkui:height 1.0 %player%", "scale set pehkui:width 0.9 %player%", "scale persist set true %player%"]

	[classes.tank]
		#Display name shown in GUI.
		name = "Ironclad"
		#Lore text. Supports '&' color codes.
		description = "You are a walking tank. Once you plant your feet, nothing on earth can move you."
		#Cosmetic stat lines.
		stats = ["&6+20% Overall Size", "&a+10 Max Health", "&a+5% Dmg Reduction", "&a+10% Healing Rx", "&c-50% Speed", "&c+100% Fall Dmg Taken"]
		#Stat modifiers.
		attributes = ["minecraft:generic.max_health=10.0:addition", "minecraft:generic.knockback_resistance=0.5:addition", "minecraft:generic.movement_speed=-0.50:multiply_base", "l2damagetracker:damage_reduction=0.05:multiply_base", "attributeslib:healing_received=0.10:multiply_base", "puffish_attributes:fall_reduction=-1.0:addition"]
