
[Toggles]
	#Enable tips on the pause screen
	enablePauseTips = true
	#Enable tips on the inventory screen
	enableInventoryTips = true
	#Enable tips on the level loading screen
	enableLoadingTips = true
	#Enable tips on the Curios inventory screen
	enableCuriosTips = true

[Tips]
